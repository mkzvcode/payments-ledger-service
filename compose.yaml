services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    init: true
    command: ['sh', '-c', 'node dist/database/migrate.js && exec node dist/main.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-ledger_dev_password}@postgres:5432/ledger
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_SIZE: 20
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres-data:
